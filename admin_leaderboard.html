<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TECHNOVA PLACEMUX 2026 — Organizer Leaderboard & Shortlist Admin</title>
  <style>
    :root {
      --blue: #1267e8;
      --navy: #07152f;
      --green: #0fae7e;
      --muted: #65748b;
      --line: #dbe6f4;
      --bg: #f5f8fc;
      --card: #ffffff;
      --gold: #eab308;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      width: 100%;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 24px 20px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 0 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .badge {
      background: #e0efff;
      color: var(--blue);
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .endpoint-bar {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .endpoint-bar input {
      flex: 1;
      min-width: 260px;
      padding: 10px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-size: 13.5px;
      font-family: monospace;
    }

    .endpoint-bar input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .endpoint-bar label {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(18, 58, 109, 0.03);
    }

    .stat-val {
      font-size: 28px;
      font-weight: 900;
      color: var(--blue);
      margin-top: 4px;
      font-family: 'SF Mono', ui-monospace, Consolas, monospace;
      word-break: break-all;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-pill {
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--navy);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-pill:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .btn-pill.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 340px;
    }

    .search-box input {
      width: 100%;
      padding: 9px 14px 9px 34px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-size: 13.5px;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 10px;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--blue);
      color: #fff;
      border: 0;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: 0.94;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.green {
      background: var(--green);
    }

    .btn.secondary {
      background: #fff;
      color: var(--navy);
      border: 1.5px solid var(--line);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(18, 58, 109, 0.05);
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    table.lb {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    table.lb th {
      background: #f8fafc;
      padding: 12px 16px;
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1.5px solid var(--line);
      white-space: nowrap;
    }

    table.lb td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
    }

    table.lb tr:hover {
      background: #fbfcfe;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13px;
      background: #f1f5f9;
      color: var(--navy);
    }

    .rank-1 {
      background: #fef08a;
      color: #854d0e;
      box-shadow: 0 2px 6px rgba(234, 179, 8, 0.2);
    }

    .rank-2 {
      background: #e2e8f0;
      color: #334155;
    }

    .rank-3 {
      background: #fed7aa;
      color: #9a3412;
    }

    .p-name {
      font-weight: 800;
      font-size: 15px;
      color: var(--navy);
    }

    .p-roll {
      color: var(--muted);
      font-size: 13px;
      font-family: 'SF Mono', ui-monospace, Consolas, monospace;
    }

    .p-time {
      font-family: 'SF Mono', ui-monospace, Consolas, monospace;
      font-weight: 900;
      color: var(--blue);
      font-size: 15.5px;
      white-space: nowrap;
    }

    .p-code {
      font-family: 'SF Mono', ui-monospace, Consolas, monospace;
      background: #f1f5f9;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 12px;
      color: #475569;
      font-weight: 700;
      white-space: nowrap;
    }

    .p-ts {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #fcfdfe;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      gap: 10px;
      flex-wrap: wrap;
    }

    .spin {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--line);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: sp 0.8s linear infinite;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--navy);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      display: none;
      z-index: 999;
    }

    /* =========================================================
       RESPONSIVE BREAKPOINTS (TABLETS & MOBILE PHONES)
       ========================================================= */
    @media (max-width: 860px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .search-box {
        max-width: 100%;
        width: 100%;
        min-width: 0;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 16px 12px;
      }

      .header {
        padding: 6px 0 14px;
        margin-bottom: 16px;
        gap: 10px;
      }

      .brand-title {
        font-size: clamp(16px, 4.5vw, 19px);
      }

      .endpoint-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 12px 14px;
        border-radius: 12px;
      }

      .endpoint-bar input {
        min-width: 0;
        width: 100%;
      }

      .endpoint-bar .btn {
        width: 100%;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }

      .stat-card {
        padding: 12px 14px;
        border-radius: 12px;
      }

      .stat-val {
        font-size: clamp(20px, 5.5vw, 24px);
      }

      .stat-label {
        font-size: 11px;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        width: 100%;
      }

      .btn-pill {
        padding: 8px 10px;
        font-size: 12px;
        width: 100%;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
      }

      .actions .btn:last-child {
        grid-column: span 2;
      }

      .card {
        border-radius: 14px;
      }

      .status-bar {
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 14px;
        font-size: 12px;
      }

      .toast {
        left: 14px;
        right: 14px;
        bottom: 14px;
        text-align: center;
        border-radius: 10px;
      }
    }

    @media (max-width: 380px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .actions .btn:last-child {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <div class="brand-title">PlaceMux × TECHNOVA 2026</div>
        <span class="badge">Organizer Desk</span>
      </div>
      <div style="font-size:13px;color:var(--muted);font-weight:700" id="clock">--:--:--</div>
    </div>

    <!-- Google Apps Script URL Config -->
    <div class="endpoint-bar">
      <label for="epInput">Apps Script Web App URL:</label>
      <input id="epInput" placeholder="https://script.google.com/macros/s/XXXXXXXX/exec" onchange="saveEndpoint()">
      <button class="btn secondary" onclick="testConnection()">Connect / Test</button>
    </div>

    <!-- Live Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Submissions</div>
        <div class="stat-val" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Fastest Record</div>
        <div class="stat-val" id="statFastest">--:--.-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top 50 Cutoff</div>
        <div class="stat-val" id="statCutoff50">--:--.-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top 100 Cutoff</div>
        <div class="stat-val" id="statCutoff100">--:--.-</div>
      </div>
    </div>

    <!-- Filters & Controls -->
    <div class="controls">
      <div class="filters">
        <button class="btn-pill active" id="btnTop50" onclick="setLimit('top50')">🏆 Top 50</button>
        <button class="btn-pill" id="btnTop100" onclick="setLimit('top100')">🎯 Top 100</button>
        <button class="btn-pill" id="btnAll" onclick="setLimit('all')">📋 All</button>
        <button class="btn-pill active" id="btnDedupe" onclick="toggleDedupe()"
          title="Shows only the fastest attempt for each roll number">⚡ Unique Roll Nos</button>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by name, roll, college…" oninput="renderTable()">
      </div>

      <div class="actions">
        <button class="btn green" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="btn secondary" onclick="copyShortlist()">📋 Copy Names & Rolls</button>
        <button class="btn" onclick="fetchLeaderboard(true)"><span id="refreshIcon">↻</span> Refresh</button>
      </div>
    </div>

    <!-- Table Card -->
    <div class="card">
      <div class="table-wrap">
        <table class="lb">
          <thead>
            <tr>
              <th style="width:60px">Rank</th>
              <th>Participant</th>
              <th>Roll No. / College</th>
              <th>Time</th>
              <th>Code</th>
              <th>Submitted At</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">Loading leaderboard data…</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="status-bar">
        <div id="statusText">Ready</div>
        <div>Auto-refresh: <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()"> (every 15s)
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentLimit = "top50";
    let dedupe = true;
    let allData = [];
    let autoRefreshTimer = null;

    const DEFAULT_ENDPOINT = "https://script.google.com/macros/s/AKfycbxM6dLGuNclSx4MtkE9Krq6xWls6X_NqyAJG_UGqUUp567zOh1yIsjqczxomoeFdFoe/exec";

    document.addEventListener("DOMContentLoaded", () => {
      const savedEp = localStorage.getItem("pmx_leaderboard_endpoint") || DEFAULT_ENDPOINT;
      document.getElementById("epInput").value = savedEp;

      // Realtime clock
      setInterval(() => {
        document.getElementById("clock").textContent = new Date().toLocaleTimeString();
      }, 1000);

      fetchLeaderboard();
      startAutoRefresh();
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    function saveEndpoint() {
      const url = document.getElementById("epInput").value.trim();
      localStorage.setItem("pmx_leaderboard_endpoint", url);
      showToast("Endpoint URL saved!");
      fetchLeaderboard(true);
    }

    function testConnection() {
      saveEndpoint();
    }

    function setLimit(limit) {
      currentLimit = limit;
      document.getElementById("btnTop50").classList.toggle("active", limit === "top50");
      document.getElementById("btnTop100").classList.toggle("active", limit === "top100");
      document.getElementById("btnAll").classList.toggle("active", limit === "all");
      renderTable();
    }

    function toggleDedupe() {
      dedupe = !dedupe;
      document.getElementById("btnDedupe").classList.toggle("active", dedupe);
      fetchLeaderboard(true);
    }

    function toggleAutoRefresh() {
      if (document.getElementById("autoRefresh").checked) {
        startAutoRefresh();
      } else {
        clearInterval(autoRefreshTimer);
      }
    }

    function startAutoRefresh() {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        fetchLeaderboard(false);
      }, 15000);
    }

    function fetchLeaderboard(showLoadingIndicator = false) {
      const ep = document.getElementById("epInput").value.trim();
      const st = document.getElementById("statusText");
      if (showLoadingIndicator) st.innerHTML = '<span class="spin"></span> Fetching latest submissions…';

      // If endpoint is unconfigured, load local fallback submissions if any
      if (!ep || ep.indexOf("PASTE_YOUR") === 0) {
        const local = JSON.parse(localStorage.getItem("pmx_submissions") || "[]");
        if (local.length) {
          allData = local;
          st.textContent = `Showing ${local.length} locally-stored submission(s) on this device. (Connect Apps Script for all participants)`;
          processAndRender();
        } else {
          st.textContent = "Please paste your Google Apps Script Web App URL above.";
          renderEmpty("Leaderboard endpoint not configured yet. Paste your Web App URL above to load submissions.");
        }
        return;
      }

      const url = ep + `?action=all&dedupe=${dedupe}&_t=${Date.now()}`;
      fetch(url)
        .then(r => r.json())
        .then(rows => {
          st.textContent = `Live data synced at ${new Date().toLocaleTimeString()} (${rows.length} records).`;
          allData = rows;
          processAndRender();
        })
        .catch(err => {
          console.warn("Backend fetch failed, trying local storage:", err);
          const local = JSON.parse(localStorage.getItem("pmx_submissions") || "[]");
          if (local.length) {
            allData = local;
            st.textContent = `Offline fallback: showing ${local.length} local records.`;
            processAndRender();
          } else {
            st.textContent = "Error connecting to Apps Script. Check Web App permissions (Who has access: Anyone).";
          }
        });
    }

    function processAndRender() {
      // Calculate quick stats
      document.getElementById("statTotal").textContent = allData.length;
      if (allData.length > 0) {
        document.getElementById("statFastest").textContent = allData[0].display || (allData[0].seconds + 's');
        document.getElementById("statCutoff50").textContent = allData.length >= 50 ? (allData[49].display || allData[49].seconds + 's') : (allData[allData.length - 1].display || 'N/A');
        document.getElementById("statCutoff100").textContent = allData.length >= 100 ? (allData[99].display || allData[99].seconds + 's') : (allData[allData.length - 1].display || 'N/A');
      } else {
        document.getElementById("statFastest").textContent = "--:--.-";
        document.getElementById("statCutoff50").textContent = "--:--.-";
        document.getElementById("statCutoff100").textContent = "--:--.-";
      }

      renderTable();
    }

    function getFilteredRows() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      let list = allData;
      if (query) {
        list = list.filter(r =>
          (r.name && r.name.toLowerCase().includes(query)) ||
          (r.roll && r.roll.toLowerCase().includes(query)) ||
          (r.code && r.code.toLowerCase().includes(query))
        );
      }

      if (currentLimit === "top50") return list.slice(0, 50);
      if (currentLimit === "top100") return list.slice(0, 100);
      return list;
    }

    function renderTable() {
      const rows = getFilteredRows();
      const tbody = document.getElementById("tableBody");
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:36px;color:var(--muted)">No matching records found.</td></tr>`;
        return;
      }

      let html = "";
      rows.forEach((r, idx) => {
        const rank = idx + 1;
        let rankClass = "rank-badge";
        if (rank === 1) rankClass += " rank-1";
        else if (rank === 2) rankClass += " rank-2";
        else if (rank === 3) rankClass += " rank-3";

        const timeStr = r.display || (r.seconds ? r.seconds.toFixed(1) + 's' : '-');
        const dateStr = r.timestamp ? new Date(r.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '-';

        html += `<tr>
      <td><span class="${rankClass}">${rank}</span></td>
      <td><div class="p-name">${escapeHtml(r.name)}</div></td>
      <td><span class="p-roll">${escapeHtml(r.roll)}</span></td>
      <td><span class="p-time">${escapeHtml(timeStr)}</span></td>
      <td><span class="p-code">${escapeHtml(r.code || '-')}</span></td>
      <td><span class="p-ts">${dateStr}</span></td>
    </tr>`;
      });
      tbody.innerHTML = html;
    }

    function renderEmpty(msg) {
      document.getElementById("tableBody").innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">${msg}</td></tr>`;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function exportCSV() {
      const rows = getFilteredRows();
      if (!rows.length) { showToast("No rows to export!"); return; }

      let csv = "Rank,Full Name,Roll No / College,Time Display,Elapsed Seconds,Mission Code,Timestamp\n";
      rows.forEach((r, idx) => {
        const rank = idx + 1;
        const name = `"${(r.name || '').replace(/"/g, '""')}"`;
        const roll = `"${(r.roll || '').replace(/"/g, '""')}"`;
        const display = `"${r.display || ''}"`;
        const sec = r.seconds || '';
        const code = `"${r.code || ''}"`;
        const ts = `"${r.timestamp || ''}"`;
        csv += `${rank},${name},${roll},${display},${sec},${code},${ts}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Technova_PlaceMux_Leaderboard_${currentLimit}_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast(`Exported ${rows.length} rows to CSV!`);
    }

    function copyShortlist() {
      const rows = getFilteredRows();
      if (!rows.length) { showToast("No rows to copy!"); return; }

      let text = `🏆 TECHNOVA PLACEMUX 2026 — ${currentLimit.toUpperCase()} SHORTLIST\n`;
      text += `Generated: ${new Date().toLocaleString()}\n\n`;
      rows.forEach((r, idx) => {
        text += `${idx + 1}. ${r.name} — ${r.roll} (${r.display || r.seconds + 's'})\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied ${rows.length} shortlist records to clipboard!`);
      }).catch(() => {
        showToast("Clipboard copy failed — check browser permissions.");
      });
    }
  </script>
</body>

</html>
